plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'maven-publish'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        selftest {
            client()
            gameDirectory = file('run')
            programArgument '--quickPlaySingleplayer'
            programArgument 'selftest'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '720'
            systemProperty 'chaosheart.selftest', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    filteringCharset = 'UTF-8'
    var expandProps = [
        'version': version,
        'mod_id': mod_id,
        'mod_name': mod_name,
        'mod_author': mod_author,
        'license': license,
        'description': mod_description,
        'neoforge_version': neoforge_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'minecraft_version_range': minecraft_version_range
    ]
    filesMatching(['META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
